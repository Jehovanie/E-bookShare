name: Build & Push Docker image

on:
  push:
    branches:
      - main
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

env:
  IMAGE_NAME: ebookshare

jobs:
  build-and-push:
    name: Build image and push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (multi-platform support) ─────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to Docker Hub ───────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Extract metadata (tags + labels) ──────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # always tag latest on main
            type=raw,value=latest,enable={{is_default_branch}}
            # short Git SHA  e.g.  abc1234
            type=sha,prefix=sha-,format=short
            # date-based tag  e.g.  2026-04-12
            type=raw,value={{date 'YYYY-MM-DD'}}

      # ── 5. Build & push ───────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs using the registry itself
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # ── 6. Summary ───────────────────────────────────────────
      - name: Print image digest
        run: |
          echo "✅ Image pushed successfully"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"

      # ── 7. Notification Discord (succès) ─────────────────────
      - name: Send success Discord notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "✅ Image Docker publiée"
          description: |
            L'image **${{ secrets.DOCKERHUB_USERNAME }}/ebookshare:latest** a été publiée sur Docker Hub.

            **Branche :** `${{ github.ref_name }}`
            **Commit :** `${{ github.sha }}`
            **Déclenché par :** ${{ github.actor }}
            **Platforms :** linux/amd64, linux/arm64

            Pour mettre à jour le serveur :
            ```
            docker compose pull && docker compose up -d
            ```
          color: 0x22c55e
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

      # ── 8. Notification Discord (échec) ──────────────────────
      - name: Send failure Discord notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "❌ Échec du build Docker"
          description: |
            Le build Docker de **EbookShare** a échoué. L'image n'a **pas** été publiée.

            **Branche :** `${{ github.ref_name }}`
            **Commit :** `${{ github.sha }}`
            **Déclenché par :** ${{ github.actor }}

            [🔍 Voir les logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xef4444
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
